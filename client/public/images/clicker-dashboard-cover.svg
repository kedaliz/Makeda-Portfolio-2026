  <text x="350" y="588" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Attendance rate</text>
  <text x="102" y="462" transform="rotate(-90 102 462)" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Quiz score</text>
  <rect x="798" y="290" width="290" height="318" rx="14" fill="#fff"/>
  <text x="824" y="328" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Class sentiment</text>
  <polyline points="826,520 852,470 878,490 904,420 930,455 956,395 982,440 1008,405 1034,430 1060,380" fill="none" stroke="#1d4ed8" stroke-width="5"/>
  <path d="M826 520 L852 470 L878 490 L904 420 L930 455 L956 395 L982 440 L1008 405 L1034 430 L1060 380 L1060 550 L826 550 Z" fill="#bfdbfe" opacity=".65"/>
  <text x="826" y="582" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Session timeline</text>
</svg>
